name: Build
on: push

jobs:
  ubuntu:
    name: Ubuntu
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
        cc: [gcc, clang]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CLICOLOR_FORCE: 1
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: sudo apt-get install -y build-essential clang cmake cmake-data libpcsclite-dev
      - name: configure
        run: |
          cmake --version
          cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: build
        run: cmake --build build
      - name: test
        run: |
          ./build/b1 2>&1 | grep --color=always "ARIB STD-B1"
          ./build/b25 2>&1 | grep --color=always "ARIB STD-B25"
          ./build/arib-b1-stream-test --help 2>&1 | grep --color=always "ARIB STD-B1"
          ./build/arib-b25-stream-test --help 2>&1 | grep --color=always "ARIB STD-B25"
          if [ "$(uname -m)" = "aarch64" ]; then MULTI2_FLAGS=-DLIBARIBB25_USE_NEON; else MULTI2_FLAGS=; fi
          ${{ matrix.cxx }} -std=c++11 -Iaribb25 $MULTI2_FLAGS tests/multi2_kat.cc aribb25/multi2.cc -o build/multi2-kat
          ./build/multi2-kat

  macos:
    name: macOS
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15
    runs-on: ${{ matrix.os }}
    env:
      CLICOLOR_FORCE: 1
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: |
          cmake --version
          cmake -B build
      - name: build
        run: cmake --build build
      - name: test
        run: |
          ./build/b1 2>&1 | grep --color=always "ARIB STD-B1"
          ./build/b25 2>&1 | grep --color=always "ARIB STD-B25"
          ./build/arib-b1-stream-test --help 2>&1 | grep --color=always "ARIB STD-B1"
          ./build/arib-b25-stream-test --help 2>&1 | grep --color=always "ARIB STD-B25"
          if [ "$(uname -m)" = "arm64" ]; then MULTI2_FLAGS=-DLIBARIBB25_USE_NEON; else MULTI2_FLAGS=; fi
          c++ -std=c++11 -Iaribb25 $MULTI2_FLAGS tests/multi2_kat.cc aribb25/multi2.cc -o build/multi2-kat
          ./build/multi2-kat

  windows:
    name: Windows
    strategy:
      matrix:
        os:
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4
      - name: build
        run: |
          msbuild arib_std_b25.sln /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v142
          msbuild arib_std_b25.sln /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142
      - name: test
        run: |
          Win32\Release\b1.exe 2>&1 | findstr "ARIB STD-B1"
          x64\Release\b1.exe 2>&1 | findstr "ARIB STD-B1"
          Win32\Release\b25.exe 2>&1 | findstr "ARIB STD-B25"
          x64\Release\b25.exe 2>&1 | findstr "ARIB STD-B25"
          Win32\Release\arib-b1-stream-test.exe --help 2>&1 | findstr "ARIB STD-B1"
          x64\Release\arib-b1-stream-test.exe --help 2>&1 | findstr "ARIB STD-B1"
          Win32\Release\arib-b25-stream-test.exe --help 2>&1 | findstr "ARIB STD-B25"
          x64\Release\arib-b25-stream-test.exe --help 2>&1 | findstr "ARIB STD-B25"

  windows-arm64:
    name: Windows ARM64 NEON
    runs-on: windows-2025
    steps:
      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4
      - name: build
        shell: pwsh
        run: |
          $arm64Props = (Resolve-Path 'aribb25\arm64-msbuild.props').Path
          msbuild aribb25\libaribb1.vcxproj /t:Build /p:Configuration=Release /p:Platform=ARM64 /p:ConfigurationType=DynamicLibrary /p:PlatformToolset=v143 /p:UseDebugLibraries=false /p:ForceImportBeforeCppTargets="$arm64Props"
          msbuild aribb25\libaribb25.vcxproj /t:Build /p:Configuration=Release /p:Platform=ARM64 /p:ConfigurationType=DynamicLibrary /p:PlatformToolset=v143 /p:UseDebugLibraries=false /p:ForceImportBeforeCppTargets="$arm64Props"
